name: CivicFlow financial validation

on:
  push:
    branches:
      - feature/self-service-firm-onboarding
    paths:
      - .github/workflows/civicflow-financial-validation.yml
      - src/lib/payments/**
      - supabase/tests/client_payment_posting_regression.sql
      - supabase/tests/client_payment_permissions_regression.sql
      - supabase/tests/client_payment_concurrency_regression.py
      - supabase/tests/client_payment_unique_intent_regression.sql
      - supabase/tests/client_payment_unique_intent_preflight.sql
      - supabase/tests/client_payment_release_gate.sql
      - supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
      - supabase/migrations/20261015_client_payment_adjustment_ledger.sql
      - supabase/migrations/20261015_client_payment_event_inbox_draft.sql
      - supabase/migrations/20261015_client_payment_plans_draft.sql
      - supabase/migrations/20261016_client_payment_atomic_posting_draft.sql
      - supabase/migrations/20261016_client_payment_authorization_draft.sql
      - src/app/api/stripe/connect/**
      - package.json
      - package-lock.json
      - vitest.financial.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary test runner without changing tracked lockfile
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund vitest@5
      - name: Validate financial draft SQL syntax without database access
        run: |
          python -m pip install --disable-pip-version-check pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = (
              "supabase/migrations/20261015_client_payment_adjustment_ledger.sql",
              "supabase/migrations/20261015_client_payment_event_inbox_draft.sql",
              "supabase/migrations/20261015_client_payment_plans_draft.sql",
              "supabase/migrations/20261016_client_payment_atomic_posting_draft.sql",
              "supabase/migrations/20261016_client_payment_authorization_draft.sql",
              "supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql",
          )
          for filename in files:
              statements = parse_sql(Path(filename).read_text(encoding="utf-8"))
              if not statements:
                  raise ValueError(f"No SQL statements in {filename}")
              print(f"Parsed {len(statements)} statements: {filename}")
          PY
      - name: Validate draft migrations in disposable PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE civicflow_financial_ci"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci <<'SQL'
          CREATE SCHEMA IF NOT EXISTS public;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.organizations (id uuid PRIMARY KEY);
          CREATE TABLE public.billing_invoices (
            id uuid PRIMARY KEY,
            organization_id uuid NOT NULL REFERENCES public.organizations(id),
            currency text NOT NULL
          );
          CREATE TABLE public.billing_payments (
            id uuid PRIMARY KEY,
            organization_id uuid NOT NULL REFERENCES public.organizations(id),
            invoice_id uuid NOT NULL REFERENCES public.billing_invoices(id),
            amount_cents bigint NOT NULL,
            status text NOT NULL,
            processor text NOT NULL,
            processor_reference text
          );
          CREATE TABLE public.organization_payment_connections (
            organization_id uuid NOT NULL REFERENCES public.organizations(id),
            stripe_account_id text NOT NULL,
            provider text NOT NULL,
            mode text NOT NULL
          );
          SQL
          for migration in \
            supabase/migrations/20261015_client_payment_event_inbox_draft.sql \
            supabase/migrations/20261015_client_payment_adjustment_ledger.sql \
            supabase/migrations/20261016_client_payment_authorization_draft.sql \
            supabase/migrations/20261016_client_payment_atomic_posting_draft.sql; do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < "$migration"
          done
      - name: Exercise authorization and idempotent ledger posting in PostgreSQL
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < supabase/tests/client_payment_posting_regression.sql
      - name: Verify financial RPC and table privileges
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < supabase/tests/client_payment_permissions_regression.sql
      - name: Test Stripe payment uniqueness on disposable PostgreSQL
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < supabase/tests/client_payment_unique_intent_regression.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci <<'SQL'
          DO $uniqueness$
          BEGIN
            BEGIN
              INSERT INTO public.billing_payments
                (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
              VALUES
                ('85858585-8585-4858-8858-858585858585',
                 '81818181-8181-4818-8818-818181818181',
                 '82828282-8282-4828-8828-828282828282',
                 1000,'succeeded','stripe','pi_duplicate_ci');
              RAISE EXCEPTION 'Index allowed duplicate succeeded Stripe payment';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            INSERT INTO public.billing_payments
              (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
            VALUES
              ('86868686-8686-4868-8868-868686868686',
               '81818181-8181-4818-8818-818181818181',
               '82828282-8282-4828-8828-828282828282',
               1000,'failed','stripe','pi_duplicate_ci');
            BEGIN
              UPDATE public.billing_payments SET status='succeeded'
              WHERE id='86868686-8686-4868-8868-868686868686';
              RAISE EXCEPTION 'Index allowed failed payment to become duplicate success';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            IF (SELECT status FROM public.billing_payments
                WHERE id='86868686-8686-4868-8868-868686868686') <> 'failed' THEN
              RAISE EXCEPTION 'Rejected status transition changed payment';
            END IF;
            INSERT INTO public.organizations(id)
            VALUES ('87878787-8787-4878-8878-878787878787');
            INSERT INTO public.billing_invoices(id,organization_id,currency)
            VALUES ('88888888-8888-4888-8888-888888888888',
                    '87878787-8787-4878-8878-878787878787','usd');
            INSERT INTO public.billing_payments
              (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
            VALUES ('89898989-8989-4898-8898-898989898989',
                    '87878787-8787-4878-8878-878787878787',
                    '88888888-8888-4888-8888-888888888888',
                    1000,'succeeded','stripe','pi_duplicate_ci');
          END;
          $uniqueness$;
          SQL
      - name: Race independent refund postings in PostgreSQL
        run: sudo -u postgres python3 - < supabase/tests/client_payment_concurrency_regression.py
      - name: Audit succeeded Stripe payment references without mutation
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci < supabase/tests/client_payment_unique_intent_preflight.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci <<'SQL'
          DO $audit$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM public.billing_payments
              WHERE processor = 'stripe' AND status = 'succeeded'
                AND (processor_reference IS NULL OR btrim(processor_reference) = '')
            ) THEN
              RAISE EXCEPTION 'Succeeded Stripe payment missing a usable reference';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.billing_payments
              WHERE processor = 'stripe' AND status = 'succeeded'
                AND processor_reference IS NOT NULL
              GROUP BY organization_id, processor_reference
              HAVING count(*) > 1
            ) THEN
              RAISE EXCEPTION 'Duplicate successful Stripe payments remain after uniqueness migration';
            END IF;
          END;
          $audit$;
          SQL
      - name: Prove missing Stripe references fail release audit
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d civicflow_financial_ci <<'SQL'
          DO $negative$
          BEGIN
            INSERT INTO public.billing_payments
              (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
            VALUES ('95959595-9595-4959-8959-959595959595',
                    '81818181-8181-4818-8818-818181818181',
                    '82828282-8282-4828-8828-828282828282',
                    1000,'succeeded','stripe','   ');
            IF NOT EXISTS (
              SELECT 1 FROM public.billing_payments
              WHERE processor='stripe' AND status='succeeded'
                AND (processor_reference IS NULL OR btrim(processor_reference)='')
            ) THEN
              RAISE EXCEPTION 'Whitespace-only Stripe reference was not detected';
            END IF;
            DELETE FROM public.billing_payments
            WHERE id='95959595-9595-4959-8959-959595959595';
            IF EXISTS (
              SELECT 1 FROM public.billing_payments
              WHERE processor='stripe' AND status='succeeded'
                AND (processor_reference IS NULL OR btrim(processor_reference)='')
            ) THEN
              RAISE EXCEPTION 'Negative-test fixture was not removed';
            END IF;
          END;
          $negative$;
          SQL
      - name: Execute actual release gate against clean and invalid records
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          gate=supabase/tests/client_payment_release_gate.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
          # The invalid record is inserted in the disposable database only.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          INSERT INTO public.billing_payments
            (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
          VALUES ('96969696-9696-4969-8969-969696969696',
                  '81818181-8181-4818-8818-818181818181',
                  '82828282-8282-4828-8828-828282828282',
                  1000,'succeeded','stripe',' ');
          SQL
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: actual release gate accepted a whitespace-only Stripe reference"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          DELETE FROM public.billing_payments
          WHERE id='96969696-9696-4969-8969-969696969696';
          SQL
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Prove financial release gate rejects a missing uniqueness index
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          gate=supabase/tests/client_payment_release_gate.sql
          # Disposable CI database only. Verify fail-closed behavior when the
          # index disappears, then restore it and verify the clean gate passes.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" -c 'DROP INDEX public.billing_payments_unique_succeeded_stripe_intent_per_org'
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: release gate accepted a missing uniqueness index"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Reject same-named uniqueness index with weaker predicate
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          gate=supabase/tests/client_payment_release_gate.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          DROP INDEX public.billing_payments_unique_succeeded_stripe_intent_per_org;
          CREATE UNIQUE INDEX billing_payments_unique_succeeded_stripe_intent_per_org
          ON public.billing_payments (organization_id, processor_reference)
          WHERE processor='stripe' AND status='succeeded'
            AND processor_reference IS NOT NULL AND amount_cents > 0;
          SQL
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: release gate accepted weaker same-named uniqueness index"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" -c 'DROP INDEX public.billing_payments_unique_succeeded_stripe_intent_per_org'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Prove uniqueness migration rejects an existing same-named index
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          migration=supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
          # Existing correct index must not cause a silent no-op.
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$migration"; then
            echo "ERROR: uniqueness migration silently accepted an existing index"
            exit 1
          fi
          # The failed DDL must leave the existing enforcement intact.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < supabase/tests/client_payment_release_gate.sql
      - name: Prove migration rejects a same-named weaker index
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          migration=supabase/migrations/20261016_unique_succeeded_stripe_payment_draft.sql
          gate=supabase/tests/client_payment_release_gate.sql
          # Disposable PostgreSQL only. Install a weaker index under the
          # production index name, then require migration failure.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          DROP INDEX public.billing_payments_unique_succeeded_stripe_intent_per_org;
          CREATE UNIQUE INDEX billing_payments_unique_succeeded_stripe_intent_per_org
          ON public.billing_payments (organization_id, processor_reference)
          WHERE processor='stripe' AND status='succeeded'
            AND processor_reference IS NOT NULL AND amount_cents > 0;
          SQL
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$migration"; then
            echo "ERROR: migration accepted a same-named weaker index"
            exit 1
          fi
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: release gate accepted a same-named weaker index after failed migration"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" -c 'DROP INDEX public.billing_payments_unique_succeeded_stripe_intent_per_org'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$migration"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Reject malformed succeeded Stripe PaymentIntent references
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          gate=supabase/tests/client_payment_release_gate.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          INSERT INTO public.billing_payments
            (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
          VALUES ('97979797-9797-4979-8979-979797979797',
                  '81818181-8181-4818-8818-818181818181',
                  '82828282-8282-4828-8828-828282828282',
                  1000,'succeeded','stripe','not_a_payment_intent');
          SQL
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: release gate accepted malformed Stripe PaymentIntent"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" -c "DELETE FROM public.billing_payments WHERE id='97979797-9797-4979-8979-979797979797'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Reject padded Stripe PaymentIntent references
        run: |
          set -euo pipefail
          db=civicflow_financial_ci
          gate=supabase/tests/client_payment_release_gate.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" <<'SQL'
          INSERT INTO public.billing_payments
            (id,organization_id,invoice_id,amount_cents,status,processor,processor_reference)
          VALUES ('98989898-9898-4989-8989-989898989898',
                  '81818181-8181-4818-8818-818181818181',
                  '82828282-8282-4828-8828-828282828282',
                  1000,'succeeded','stripe',' pi_looksValid123 ');
          SQL
          if sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"; then
            echo "ERROR: release gate accepted padded Stripe PaymentIntent"
            exit 1
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" -c "DELETE FROM public.billing_payments WHERE id='98989898-9898-4989-8989-989898989898'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$db" < "$gate"
      - name: Run financial regression suite
        run: npx vitest run --config vitest.financial.config.ts
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build validation
        env:
          # Public, non-production CI placeholders. No service-role key or live credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: npm run build
